apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boardly-db-data
  namespace: boardly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardly-db
  namespace: boardly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: boardly-db
  template:
    metadata:
      labels:
        app: boardly-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: boardly_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: boardly-secret, key: DB_USERNAME }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: boardly-secret, key: DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: boardly-db-data
        - name: init
          configMap:
            name: boardly-db-init
            items:
              - key: 01-schema.sql
                path: 01-schema.sql
              - key: 02-seed-dev.sql
                path: 02-seed-dev.sql
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: boardly
spec:
  selector:
    app: boardly-db
  ports:
    - port: 5432
      targetPort: 5432
