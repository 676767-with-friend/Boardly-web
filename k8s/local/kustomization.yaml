
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../00-namespace.yaml
  - ../10-postgres.yaml
  - ../15-db-migrate.yaml
  - ../20-backend.yaml
  - ../30-frontend.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: boardly-backend
      namespace: boardly
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: boardly-frontend
      namespace: boardly
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
