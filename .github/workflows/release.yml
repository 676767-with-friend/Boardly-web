name: Publish and deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish Docker images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Require successful CI for this commit
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: context.sha,
              branch: 'main', event: 'push', per_page: 100
            })
            const run = runs
              .filter(item => item.head_sha === context.sha && item.event === 'push' && item.head_branch === 'main')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0]
            if (!run || run.conclusion !== 'success') {
              core.setFailed(`No successful main-branch CI run for ${context.sha}`)
              return
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100
            })
            const required = ['Frontend (build + Vitest)', 'Backend (mvn verify)', 'E2E (Cypress)']
            const missing = required.filter(name => !jobs.some(job => job.name === name && job.conclusion === 'success'))
            if (missing.length) core.setFailed(`Required CI jobs did not pass: ${missing.join(', ')}`)
            else core.info(`Validated CI run: ${run.html_url}`)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and publish images
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_REGISTRY:?Set the IMAGE_REGISTRY secret}"
          : "${REGISTRY_USERNAME:?Set the REGISTRY_USERNAME secret}"
          : "${REGISTRY_PASSWORD:?Set the REGISTRY_PASSWORD secret}"
          docker build -t "${IMAGE_REGISTRY}/boardly-backend:${IMAGE_TAG}" ./backend
          docker build -t "${IMAGE_REGISTRY}/boardly-frontend:${IMAGE_TAG}" -f frontend/Dockerfile .
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "${IMAGE_REGISTRY%%/*}" --username "$REGISTRY_USERNAME" --password-stdin
          docker push "${IMAGE_REGISTRY}/boardly-backend:${IMAGE_TAG}"
          docker push "${IMAGE_REGISTRY}/boardly-frontend:${IMAGE_TAG}"

  deploy:
    name: Deploy to Minikube
    needs: publish
    runs-on: self-hosted
    environment: minikube
    concurrency:
      group: boardly-deploy-minikube
      cancel-in-progress: false
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      K8S_DB_USERNAME: ${{ secrets.K8S_DB_USERNAME }}
      K8S_DB_PASSWORD: ${{ secrets.K8S_DB_PASSWORD }}
      K8S_JWT_SECRET: ${{ secrets.K8S_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy and smoke test
        shell: bash
        run: bash .github/scripts/deploy.sh
