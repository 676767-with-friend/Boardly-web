name: Build and deploy locally

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boardly-release-minikube
  cancel-in-progress: false

jobs:
  gate:
    name: Verify main CI and release target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.repository.id == github.event.repository.id &&
       github.event.workflow_run.head_repository.id == github.event.repository.id &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      eligible: ${{ steps.verify.outputs.eligible }}
    steps:
      # workflow_run has elevated access; only execute code from trusted main here.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify CI and current main commit
        id: verify
        uses: actions/github-script@v9
        env:
          MINIKUBE_RUNNER_LABEL: ${{ vars.MINIKUBE_RUNNER_LABEL }}
        with:
          script: |
            const { checkCiRun } = require('./.github/scripts/release-guard.cjs')
            const { owner, repo } = context.repo
            let run
            if (context.eventName === 'workflow_run') {
              run = context.payload.workflow_run
            } else if (context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', head_sha: context.sha,
                branch: 'main', event: 'push', per_page: 100
              })
              run = data.workflow_runs
                .filter(item => item.head_sha === context.sha && item.event === 'push' && item.head_branch === 'main')
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0]
            } else {
              core.setFailed('Manual retries must run on main')
              return
            }
            if (!run) {
              core.setFailed(`No push-triggered main CI run for ${context.sha}`)
              return
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100
            })
            const problem = checkCiRun(run, jobs, context.payload.repository.id)
            if (problem) {
              core.setFailed(problem)
              return
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' })
            if (run.head_sha !== branch.commit.sha) {
              core.info(`Skipped superseded release ${run.head_sha}; main is ${branch.commit.sha}`)
              await core.summary.addRaw(`Skipped superseded release ${run.head_sha}; main is ${branch.commit.sha}`).write()
              return
            }
            const label = process.env.MINIKUBE_RUNNER_LABEL
            if (!label || !label.trim() || ['self-hosted', 'linux', 'x64'].includes(label.toLowerCase())) {
              core.setFailed('Set MINIKUBE_RUNNER_LABEL to the verified unique label of the authorized local Minikube runner')
              return
            }
            core.setOutput('sha', run.head_sha)
            core.setOutput('eligible', 'true')
            await core.summary.addRaw(`CI passed: ${run.html_url}; release commit: ${run.head_sha}`).write()

  deploy:
    name: Deploy to Minikube
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    timeout-minutes: 45
    runs-on: [self-hosted, linux, "${{ vars.MINIKUBE_RUNNER_LABEL }}"]
    environment: minikube
    env:
      IMAGE_TAG: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Build and load exact tested revision
        shell: bash
        run: bash .github/scripts/deploy.sh build
      - name: Skip superseded release immediately before deployment
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' })
            if (branch.commit.sha === process.env.IMAGE_TAG) {
              core.setOutput('current', 'true')
            } else {
              await core.summary.addRaw(`Skipped superseded release ${process.env.IMAGE_TAG}; main is ${branch.commit.sha}`).write()
            }
      - name: Deploy and smoke test
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: bash .github/scripts/deploy.sh deploy
