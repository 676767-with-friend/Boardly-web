# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ยกเลิก run เก่าของ branch เดียวกันเมื่อมี push ใหม่
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vitest 5 / jsdom 30 ต้องการ Node >= 22.12 (Dockerfile ก็ใช้ 22)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0 # job นี้ไม่รัน Cypress ไม่ต้องโหลด binary
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Unit test (Vitest)
        working-directory: frontend
        run: npm test # ไม่ใช้ --if-present: ถ้าไม่มี script "test" ต้อง fail ไม่ใช่เงียบ ๆ ข้าม

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boardly
          POSTGRES_PASSWORD: boardly
          POSTGRES_DB: boardly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardly -d boardly_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/boardly_db
      DB_USERNAME: boardly
      DB_PASSWORD: boardly
      JWT_SECRET: github-actions-ci-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Init database
        env:
          PGPASSWORD: boardly
        run: psql -h localhost -U boardly -d boardly_db -v ON_ERROR_STOP=1 -f database/Boardly_schema.sql
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        working-directory: backend
        run: mvn -B verify

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # db + backend + frontend ตาม compose.yaml (schema + seed-dev.sql ถูกโหลดตอน db เริ่ม)
      # --wait รอจน healthcheck ของทุก service ผ่าน
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Run Cypress
        working-directory: frontend
        run: npx cypress run # baseUrl ตั้งไว้ใน cypress.config.ts (http://localhost:8443)

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
