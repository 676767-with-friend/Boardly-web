name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Unit tests with coverage
        working-directory: frontend
        run: pnpm test:coverage
      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/reports
          if-no-files-found: ignore
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boardly_test
          POSTGRES_PASSWORD: boardly_test
          POSTGRES_DB: boardly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardly_test -d boardly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/boardly_test
      DB_USERNAME: boardly_test
      DB_PASSWORD: boardly_test
      JWT_SECRET: boardly-ci-test-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Initialize test database
        env:
          PGPASSWORD: boardly_test
        run: |
          psql -h localhost -U boardly_test -d boardly_test -v ON_ERROR_STOP=1 -f database/Boardly_schema.sql
          psql -h localhost -U boardly_test -d boardly_test -v ON_ERROR_STOP=1 -f database/seed-dev.sql
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B clean verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        working-directory: frontend
        run: pnpm exec cypress install
      - name: Run Cypress
        working-directory: frontend
        run: pnpm exec cypress run
      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
