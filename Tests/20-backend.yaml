apiVersion: v1
kind: Secret
metadata:
  name: boardly-backend-secret
  namespace: boardly
type: Opaque
stringData:
  JWT_SECRET: boardly-k8s-development-jwt-secret-at-least-32-characters
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardly-backend
  namespace: boardly
spec:
  replicas: 2
  selector:
    matchLabels: { app: boardly-backend }
  template:
    metadata:
      labels: { app: boardly-backend }
    spec:
      containers:
        - name: backend
          # Jenkins replaces this with <registry>/boardly-backend:<build-tag> at deploy time
          image: boardly-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: DB_URL
              value: "jdbc:postgresql://boardly-db:5432/boardly_db"
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: boardly-db-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: boardly-db-secret, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: boardly-backend-secret, key: JWT_SECRET } }
            - name: FRONTEND_BASE_URL
              value: "http://boardly-frontend"
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: boardly-backend
  namespace: boardly
spec:
  selector: { app: boardly-backend }
  ports:
    - port: 8080
      targetPort: 8080
