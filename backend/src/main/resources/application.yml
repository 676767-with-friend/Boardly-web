spring:
  application:
    name: boardly-backend
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boardly_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:900}

boardly:
  auth:
    refresh-expiry-seconds: ${AUTH_REFRESH_EXPIRY_SECONDS:2592000}
    reset-expiry-seconds: ${AUTH_RESET_EXPIRY_SECONDS:1800}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8443}
    dev-reset-token-exposure: false

# Keep management endpoints on an internal listener, separate from the public API.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
